<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Panel Admin — Recreativa Barra Honda</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: system-ui, sans-serif; color: #1f2937; line-height: 1.6; background: #f9fafb; }
      button {
        cursor: pointer;
        padding: 0.45rem 1rem;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        background: white;
        font-size: 0.9rem;
      }
      button:hover:not(:disabled) { background: #f3f4f6; }
      button:disabled { opacity: 0.55; cursor: not-allowed; }
      input {
        padding: 0.5rem 0.75rem;
        border: 1px solid #d1d5db;
        border-radius: 4px;
        font-size: 1rem;
        width: 100%;
      }
      input:focus { outline: 2px solid #2563eb; border-color: transparent; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
